<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A56DB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M256 32 L440 96 L440 224 C440 352 352 448 256 480 C160 448 72 352 72 224 L72 96 Z"
        fill="url(#shield-grad)" stroke="#1E293B" stroke-width="6"/>
  <!-- Interior link/chain - forming a G shape -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left arc of G/link -->
    <path d="M200 240 C200 180, 240 160, 280 160 C310 160, 330 170, 340 190"/>
    <!-- Right arc of G/link -->
    <path d="M340 190 L340 230 L290 230"/>
    <!-- Link chain bottom -->
    <path d="M200 240 C200 300, 240 340, 280 340 C330 340, 340 300, 340 280"/>
    <!-- Small link ring -->
    <circle cx="210" cy="340" r="20"/>
  </g>
  <!-- Subtle checkmark inside the ring to imply "safe/verified" -->
  <g stroke="#16A34A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M200 342 L208 350 L222 334"/>
  </g>
</svg>